<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi配置 - NFC门禁</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="stylesheet" href="/web/css/pages.css">
</head>
<body id="page-wifi">
    <div class="container narrow" data-animate>
        <h1>WiFi配置</h1>

        <!-- WiFi状态显示 -->
        <div class="status-indicator">
            <span class="status-dot" id="wifiStatusDot"></span>
            <span id="wifiStatusText">加载中...</span>
        </div>

        <!-- 扫描按钮 -->
        <button onclick="scanWifi()" class="btn btn-primary" style="margin-top: var(--spacing-lg);" id="scanBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; margin-right: 8px;">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
            扫描WiFi网络
        </button>

        <!-- WiFi网络列表 -->
        <div id="wifiList" class="wifi-list" style="margin-top: var(--spacing-lg);">
            <p style="text-align: center; color: var(--text-secondary);">点击"扫描WiFi网络"开始扫描</p>
        </div>

        <!-- WiFi配置表单 -->
        <div id="wifiConfig" style="margin-top: var(--spacing-xl); display: none;">
            <h3>连接到: <span id="selectedSSID"></span></h3>
            <form onsubmit="return false;">
                <div class="password-wrapper">
                    <input type="password" id="wifiPassword" class="wifi-password" placeholder="输入WiFi密码" autocomplete="off" />
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="error-hint" id="passwordError">请输入WiFi密码</div>
            </form>
            
            <div style="display: flex; gap: var(--spacing-md); margin-top: var(--spacing-md);">
                <button onclick="testConnection()" class="btn btn-warning" style="flex: 1;" id="testBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; margin-right: 8px;">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    测试连接
                </button>
                <button onclick="saveConfig()" class="btn btn-success" style="flex: 1;" id="saveBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; margin-right: 8px;">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    保存配置
                </button>
            </div>
        </div>

        <!-- 清除配置按钮 -->
        <button onclick="clearConfig()" class="btn btn-danger" style="margin-top: var(--spacing-xl); width: 100%;" id="clearBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; margin-right: 8px;">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            清除WiFi配置
        </button>

        <!-- 返回首页 -->
        <a href="/" class="btn" style="margin-top: var(--spacing-md); display: block; text-align: center; text-decoration: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            返回首页
        </a>

    </div>

    <!-- 日志切换按钮 -->
    <button id="log-toggle-btn" class="log-toggle-btn" onclick="toggleLogWindow()" aria-label="显示/隐藏日志">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="log-toggle-badge" id="log-toggle-badge" style="display: none;"></span>
    </button>

    <!-- 日志浮窗 -->
    <div id="log-float-window" class="log-float-window" style="display: none;">
        <div class="log-float-header" id="log-float-header">
            <div class="log-float-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>系统日志</span>
            </div>
            <div class="log-float-controls">
                <button class="log-float-minimize-btn" onclick="minimizeLogWindow()" aria-label="最小化" title="最小化">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="log-float-close-btn" onclick="toggleLogWindow()" aria-label="关闭" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="log-float-body" id="log-float-body">
            <div class="log-float-toolbar">
                <select id="log-filter" onchange="setLogFilter(this.value)" aria-label="日志级别过滤">
                    <option value="0">全部</option>
                    <option value="1">ERROR</option>
                    <option value="2">WARN+</option>
                    <option value="3">INFO+</option>
                    <option value="4">DEBUG+</option>
                    <option value="5">VERBOSE+</option>
                </select>
                <button onclick="clearLogs()" aria-label="清空日志">清空</button>
            </div>
            <div id="log-output" class="log-float-output"></div>
        </div>
    </div>

    <script src="/web/js/common.js"></script>
    <script src="/web/js/pages/wifi.js"></script>
</body>
</html>
