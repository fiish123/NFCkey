<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片管理 - NFC门禁</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="stylesheet" href="/web/css/pages.css">
</head>
<body id="page-cards">
    <main>
    <div class="container narrow" data-animate>
        <h1>卡片管理</h1>

        <!-- 卡片操作区域 -->
        <div class="section primary">
            <h3>卡片操作</h3>
            
            <!-- 读卡 -->
            <div class="card-reader-container">
                <div id="readerStatus" class="reader-status" role="status" aria-live="polite">
                    <div class="status-indicator" aria-hidden="true"></div>
                    <span id="statusText">等待读取...</span>
                </div>
                <button type="button" onclick="readCard()" class="btn btn-primary" id="readBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    读取
                </button>
            </div>

            <hr>

            <!-- 添加卡片表单 -->
            <div class="input-group">
                <label for="cardUID">卡UID</label>
                <input type="text" id="cardUID" placeholder="例如: A1B2C3D4" maxlength="8" />
            </div>
            <div class="input-group">
                <label for="cardName">卡片名称</label>
                <input type="text" id="cardName" placeholder="例如: 门禁卡1" maxlength="32" />
            </div>
            <button type="button" onclick="addCard()" class="btn btn-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加卡片
            </button>
        </div>

        <!-- 卡片逻辑控制 -->
        <div class="section secondary">
            <h3>卡片逻辑控制</h3>
            <div class="toggle-container">
                <label class="toggle-label" id="cardLogicToggleLabel" for="cardLogicToggle">启用刷卡自动处理</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="cardLogicToggle" onchange="toggleCardLogic()" aria-labelledby="cardLogicToggleLabel">
                    <span class="toggle-slider" aria-hidden="true"></span>
                </label>
            </div>
        </div>

        <!-- 卡片列表 -->
        <div class="section primary">
            <h3>授权卡片列表 <small id="cardCount" aria-live="polite">(0)</small></h3>
            <div id="cardsList" class="cards-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                    <p>暂无授权卡片</p>
                </div>
            </div>
        </div>

        <!-- 返回首页 -->
        <div class="back-to-home">
            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回首页
            </a>
        </div>

    </div>
    </main>

    <script src="/web/js/common.js"></script>
    <script src="/web/js/pages/cards.js"></script>
</body>
</html>
