<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片管理 - NFC门禁</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="stylesheet" href="/web/css/pages.css">
</head>
<body id="page-cards">
    <div class="container narrow" data-animate>
        <h1>卡片管理</h1>

        <!-- 卡片操作区域 -->
        <div class="section primary">
            <h3>卡片操作</h3>
            
            <!-- 读卡 -->
            <div class="card-reader-container">
                <div id="readerStatus" class="reader-status">
                    <div class="status-indicator"></div>
                    <span id="statusText">等待读取...</span>
                </div>
                <button onclick="readCard()" class="btn btn-primary" id="readBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    读取
                </button>
            </div>

            <hr>

            <!-- 添加卡片表单 -->
            <div class="input-group">
                <label for="cardUID">卡UID</label>
                <input type="text" id="cardUID" placeholder="例如: A1B2C3D4" maxlength="8" />
            </div>
            <div class="input-group">
                <label for="cardName">卡片名称</label>
                <input type="text" id="cardName" placeholder="例如: 门禁卡1" maxlength="32" />
            </div>
            <button onclick="addCard()" class="btn btn-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加卡片
            </button>
        </div>

        <!-- 卡片逻辑控制 -->
        <div class="section secondary">
            <h3>卡片逻辑控制</h3>
            <div class="toggle-container">
                <label class="toggle-label">启用刷卡自动处理</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="cardLogicToggle" onchange="toggleCardLogic()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <!-- 卡片列表 -->
        <div class="section primary">
            <h3>授权卡片列表 <small id="cardCount">(0)</small></h3>
            <div id="cardsList" class="cards-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                    <p>暂无授权卡片</p>
                </div>
            </div>
        </div>

        <!-- 返回首页 -->
        <div class="back-to-home">
            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回首页
            </a>
        </div>

    </div>

    <!-- 日志切换按钮 -->
    <button id="log-toggle-btn" class="log-toggle-btn" onclick="toggleLogWindow()" aria-label="显示/隐藏日志">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="log-toggle-badge" id="log-toggle-badge" style="display: none;"></span>
    </button>

    <!-- 日志浮窗 -->
    <div id="log-float-window" class="log-float-window" style="display: none;">
        <div class="log-float-header" id="log-float-header">
            <div class="log-float-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>系统日志</span>
            </div>
            <div class="log-float-controls">
                <button class="log-float-minimize-btn" onclick="minimizeLogWindow()" aria-label="最小化" title="最小化">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="log-float-close-btn" onclick="toggleLogWindow()" aria-label="关闭" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="log-float-body" id="log-float-body">
            <div class="log-float-toolbar">
                <select id="log-filter" onchange="setLogFilter(this.value)" aria-label="日志级别过滤">
                    <option value="0">全部</option>
                    <option value="1">ERROR</option>
                    <option value="2">WARN+</option>
                    <option value="3">INFO+</option>
                    <option value="4">DEBUG+</option>
                    <option value="5">VERBOSE+</option>
                </select>
                <button onclick="clearLogs()" aria-label="清空日志">清空</button>
            </div>
            <div id="log-output" class="log-float-output"></div>
        </div>
    </div>

    <script src="/web/js/common.js"></script>
    <script src="/web/js/pages/cards.js"></script>
</body>
</html>
