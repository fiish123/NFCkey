<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA升级 - NFC门禁</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="stylesheet" href="/web/css/pages.css">
</head>
<body id="page-ota">
    <div class="container narrow" data-animate>
        <h1>OTA升级</h1>

        <!-- 系统信息 -->
        <div class="section system-info">
            <h3>系统信息</h3>
            <div class="system-info-grid">
                <div class="info-item">
                    <strong>芯片型号:</strong>
                    <span id="chipModel">-</span>
                </div>
                <div class="info-item">
                    <strong>芯片ID:</strong>
                    <span id="chipId">-</span>
                </div>
                <div class="info-item">
                    <strong>当前版本:</strong>
                    <span id="currentVersion">-</span>
                </div>
            </div>
        </div>

        <!-- 固件上传 -->
        <div class="section" id="uploadSection">
            <h3>固件上传</h3>
            <div class="upload-box" id="uploadBox">
                <input type="file" id="file" accept=".bin" style="display: none;" />
                <div id="uploadBoxContent" class="upload-box-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; margin-bottom: var(--spacing-md);">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>点击选择 .bin 文件或拖拽文件到此处</p>
                    <p class="hint" style="font-size: 12px; color: var(--text-secondary); margin-top: var(--spacing-sm);">
                        最大支持 2MB
                    </p>
                </div>
                <div id="fileInfo" style="display: none; text-align: center;">
                    <p><strong>文件名:</strong> <span id="fileName"></span></p>
                    <p><strong>大小:</strong> <span id="fileSize"></span></p>
                </div>
            </div>

            <!-- 上传进度 -->
            <div id="progressContainer" class="progress-container" style="display: none; margin-top: var(--spacing-lg);">
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar">0%</div>
                </div>
                <p class="progress-hint" style="text-align: center; color: var(--text-secondary); font-size: 13px; margin-top: var(--spacing-sm);">
                    请勿关闭浏览器，等待上传完成...
                </p>
            </div>
        </div>

        <!-- 注意事项 -->
        <div class="section">
            <h3>注意事项</h3>
            <ul class="note-list">
                <li>升级过程中请勿关闭浏览器</li>
                <li>升级完成后设备将自动重启</li>
                <li>请确保电源稳定，避免断电导致升级失败</li>
                <li>升级失败时设备会自动回滚到旧版本</li>
            </ul>
        </div>

        <!-- 返回首页 -->
        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回首页
            </a>
        </div>

    </div>

    <!-- 日志切换按钮 -->
    <button id="log-toggle-btn" class="log-toggle-btn" onclick="toggleLogWindow()" aria-label="显示/隐藏日志">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="log-toggle-badge" id="log-toggle-badge" style="display: none;"></span>
    </button>

    <!-- 日志浮窗 -->
    <div id="log-float-window" class="log-float-window" style="display: none;">
        <div class="log-float-header" id="log-float-header">
            <div class="log-float-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>系统日志</span>
            </div>
            <div class="log-float-controls">
                <button class="log-float-minimize-btn" onclick="minimizeLogWindow()" aria-label="最小化" title="最小化">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="log-float-close-btn" onclick="toggleLogWindow()" aria-label="关闭" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="log-float-body" id="log-float-body">
            <div class="log-float-toolbar">
                <select id="log-filter" onchange="setLogFilter(this.value)" aria-label="日志级别过滤">
                    <option value="0">全部</option>
                    <option value="1">ERROR</option>
                    <option value="2">WARN+</option>
                    <option value="3">INFO+</option>
                    <option value="4">DEBUG+</option>
                    <option value="5">VERBOSE+</option>
                </select>
                <button onclick="clearLogs()" aria-label="清空日志">清空</button>
            </div>
            <div id="log-output" class="log-float-output"></div>
        </div>
    </div>

    <script src="/web/js/common.js"></script>
    <script src="/web/js/pages/ota.js"></script>
</body>
</html>
