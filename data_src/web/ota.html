<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA升级 - NFC门禁</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="stylesheet" href="/web/css/pages.css">
</head>
<body id="page-ota">
    <main>
    <div class="container narrow" data-animate>
        <h1>OTA升级</h1>

        <!-- 系统信息 -->
        <div class="section system-info">
            <h3>系统信息</h3>
            <div class="system-info-grid">
                <div class="info-item">
                    <strong>芯片型号:</strong>
                    <span id="chipModel">-</span>
                </div>
                <div class="info-item">
                    <strong>芯片ID:</strong>
                    <span id="chipId">-</span>
                </div>
                <div class="info-item">
                    <strong>当前版本:</strong>
                    <span id="currentVersion">-</span>
                </div>
            </div>
        </div>

        <!-- 固件上传 -->
        <div class="section" id="uploadSection">
            <h3>固件上传</h3>
            <div class="upload-box" id="uploadBox" role="button" tabindex="0" aria-label="选择固件文件或拖拽文件到此处">
                <input type="file" id="file" accept=".bin" style="display: none;" aria-label="选择固件文件" aria-describedby="otaUploadHint" />
                <div id="uploadBoxContent" class="upload-box-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; margin-bottom: var(--spacing-md);" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>点击选择 .bin 文件或拖拽文件到此处</p>
                    <p id="otaUploadHint" class="hint" style="font-size: 12px; color: var(--text-secondary); margin-top: var(--spacing-sm);">
                        最大支持 2MB
                    </p>
                </div>
                <div id="fileInfo" style="display: none; text-align: center;">
                    <p><strong>文件名:</strong> <span id="fileName"></span></p>
                    <p><strong>大小:</strong> <span id="fileSize"></span></p>
                </div>
            </div>

            <!-- 上传进度 -->
            <div id="progressContainer" style="display: none; margin-top: var(--spacing-lg);">
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar" role="status" aria-live="polite">0%</div>
                </div>
                <p class="progress-hint" style="text-align: center; color: var(--text-secondary); font-size: 13px; margin-top: var(--spacing-sm);">
                    请勿关闭浏览器，等待上传完成...
                </p>
            </div>
        </div>

        <!-- 注意事项 -->
        <div class="section">
            <h3>注意事项</h3>
            <ul class="note-list">
                <li>升级过程中请勿关闭浏览器</li>
                <li>升级完成后设备将自动重启</li>
                <li>请确保电源稳定，避免断电导致升级失败</li>
                <li>升级失败时设备会自动回滚到旧版本</li>
            </ul>
        </div>

        <!-- 返回首页 -->
        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回首页
            </a>
        </div>
    </div>
    </main>

    <script src="/web/js/common.js"></script>
    <script src="/web/js/pages/ota.js"></script>
</body>
</html>
