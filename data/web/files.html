<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - LittleFS</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <style>
        /* 页面特定样式 */
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 40px;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* 文件项逐个显示动画 */
        .item {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.4s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container" data-animate>
        <h1>LittleFS 文件管理</h1>

        <div class="path-bar">
            <span>当前路径:</span>
            <input type="text" id="currentPath" value="/" readonly aria-label="当前路径">
            <button class="btn" onclick="goToParent()" aria-label="上级目录">上级目录</button>
            <button class="btn" onclick="createDir()" aria-label="新建文件夹">新建文件夹</button>
        </div>

        <div class="storage-info">
            <div class="info-text">
                <span>已用: <span id="usedStorage">0</span> KB</span>
                <span>总计: <span id="totalStorage">0</span> KB</span>
                <span>剩余: <span id="freeStoragePercent">0</span>%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="storageProgressBar"></div>
            </div>
            <div class="progress-text">剩余空间: <span id="freeStorage">0</span> KB</div>
        </div>

        <div class="upload-section" id="uploadSection" onclick="document.getElementById('file').click()">
            <div class="upload-content" id="uploadContent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h3>点击或拖拽上传</h3>
                <p>支持任意格式的文件</p>
            </div>
            <div class="file-info" id="fileInfo" style="display: none;">
                <strong id="fileName"></strong>
                <span class="file-size" id="fileSize"></span>
                <div class="upload-progress" id="uploadProgress" style="display: none;">
                    <div class="upload-progress-bar" id="uploadProgressBar"></div>
                    <span class="upload-progress-text" id="uploadProgressText">0%</span>
                </div>
            </div>
            <input type="file" id="file" style="display: none;" aria-label="选择文件">
        </div>

        <div class="file-list">
            <div id="fileListContainer"></div>
        </div>

        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            返回主页
        </a>
    </div>

    <script src="/web/js/common.js"></script>
    <script>
        let currentPath = '/';
        let selectedFile = null;

        window.onload = function() {
            loadList(currentPath);
            loadStorageInfo();
            initDragAndDrop();
        };

        // SVG图标
        const dirIcon = `<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;
        const fileIcon = `<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`;
        const deleteIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
        const downloadIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;

        // 初始化拖拽上传
        function initDragAndDrop() {
            const uploadSection = document.getElementById('uploadSection');
            const fileInput = document.getElementById('file');
            
            initDragAndDropCommon(uploadSection, fileInput, function(file) {
                selectedFile = file;
                displayFileInfo(file);
                validateAndUpload(file);
            });
        }

        // 初始化拖拽上传的公共函数（已在common.js中定义，这里重写以兼容）
        function initDragAndDropCommon(uploadElement, fileInput, callback) {
            if (!uploadElement || !fileInput) return;
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file && callback) {
                    callback(file);
                }
            });
            
            uploadElement.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadElement.classList.add('drag-over');
            });
            
            uploadElement.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadElement.classList.remove('drag-over');
            });
            
            uploadElement.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadElement.classList.remove('drag-over');
                
                const files = e.dataTransfer.files;
                if (files.length > 0 && callback) {
                    callback(files[0]);
                }
            });
        }

        // 显示文件信息
        function displayFileInfo(file) {
            const uploadContent = document.getElementById('uploadContent');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            
            // 隐藏上传内容，显示文件信息
            if (uploadContent) uploadContent.style.display = 'none';
            if (fileInfo) {
                fileInfo.style.display = 'block';
                if (fileName) fileName.textContent = file.name;
                if (fileSize) fileSize.textContent = formatFileSize(file.size);
            }
        }

        // 重置上传区域
        function resetUploadArea() {
            const uploadContent = document.getElementById('uploadContent');
            const fileInfo = document.getElementById('fileInfo');
            const fileInput = document.getElementById('file');
            
            // 恢复上传区域初始状态
            if (uploadContent) uploadContent.style.display = '';
            if (fileInfo) fileInfo.style.display = 'none';
            if (fileInput) fileInput.value = '';
            selectedFile = null;
        }

        // 验证并上传
        function validateAndUpload(file) {
            loadStorageInfo();
            
            fetch('/api/fs/info')
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    const fileSizeKB = Math.ceil(file.size / 1024);
                    const freeSpaceKB = data.free;
                    
                    if (fileSizeKB > freeSpaceKB) {
                        showToast('存储空间不足！\n\n文件大小: ' + fileSizeKB + ' KB\n剩余空间: ' + freeSpaceKB + ' KB\n\n请删除一些文件后再试。', 'warning', { duration: 5000 });
                        resetUploadArea();
                    } else {
                        uploadFile(file);
                    }
                })
                .catch(err => {
                    console.error('验证文件失败:', err);
                    showToast('验证失败: ' + err.message, 'error');
                });
        }

        // 加载存储信息
        function loadStorageInfo() {
            fetch('/api/fs/info')
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    document.getElementById('usedStorage').textContent = data.used;
                    document.getElementById('totalStorage').textContent = data.total;
                    document.getElementById('freeStorage').textContent = data.free;
                    document.getElementById('freeStoragePercent').textContent = data.freePercent;
                    
                    const progressBar = document.getElementById('storageProgressBar');
                    progressBar.style.width = (100 - data.freePercent) + '%';
                    
                    progressBar.className = 'progress-bar';
                    if (data.freePercent < 20) {
                        progressBar.classList.add('danger');
                    } else if (data.freePercent < 50) {
                        progressBar.classList.add('warning');
                    }
                })
                .catch(err => {
                    console.error('加载存储信息失败:', err);
                });
        }

        function loadList(path) {
            fetch('/list?path=' + encodeURIComponent(path))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    currentPath = path;
                    document.getElementById('currentPath').value = path;
                    renderList(data);
                })
                .catch(err => {
                    showToast('加载失败: ' + err.message, 'error');
                });
        }

        function renderList(items) {
            const container = document.getElementById('fileListContainer');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty">文件夹为空</div>';
                return;
            }

            // 分离文件夹和文件
            const directories = [];
            const files = [];
            
            items.forEach(item => {
                if (item.isDirectory) {
                    directories.push(item);
                } else {
                    files.push(item);
                }
            });

            // 分别排序：按名称字母顺序
            directories.sort((a, b) => a.name.localeCompare(b.name));
            files.sort((a, b) => a.name.localeCompare(b.name));

            // 合并：文件夹在前，文件在后
            const sortedItems = [...directories, ...files];

            let html = '';
            sortedItems.forEach((item, index) => {
                const isDir = item.isDirectory;
                const icon = isDir ? dirIcon : fileIcon;
                const sizeStr = isDir ? '<DIR>' : formatFileSize(item.size);
                const escapedName = item.name.replace(/'/g, "\\'").replace(/"/g, '"');
                const onclick = isDir ? `onclick="navigate('${escapedName}')"` : '';
                const delayStyle = `style="animation-delay: ${index * 0.05}s;"`;
                html += `
                    <div class="item ${isDir ? 'directory' : ''}" ${delayStyle} ${onclick} role="button" tabindex="0" aria-label="${escapedName}">
                        <span class="name">${icon} ${item.name}</span>
                        <span class="size">${sizeStr}</span>
                        <div class="actions">
                            ${isDir ? '' : '<button class="btn-sm btn-download" onclick="event.stopPropagation(); downloadFile(\'' + escapedName + '\')" aria-label="下载文件">' + downloadIcon + ' 下载</button>'}
                            ${isDir ? '' : '<button class="btn-sm" onclick="event.stopPropagation(); deleteItem(\'' + escapedName + '\', false)" aria-label="删除文件">' + deleteIcon + ' 删除</button>'}
                            ${isDir ? '<button class="btn-sm" onclick="event.stopPropagation(); deleteItem(\'' + escapedName + '\', true)" aria-label="删除目录">' + deleteIcon + ' 删除目录</button>' : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function navigate(name) {
            let newPath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
            newPath = newPath.replace(/\/+/g, '/');
            loadList(newPath);
        }

        function goToParent() {
            if (currentPath === '/') return;
            let parts = currentPath.split('/');
            parts.pop();
            let parent = parts.join('/');
            if (parent === '') parent = '/';
            loadList(parent);
        }

        async function createDir() {
            const dirName = await showPrompt('', {
                title: '新建文件夹',
                placeholder: '文件夹名称',
                type: 'success',
                confirmText: '创建',
                cancelText: '取消'
            });
            
            if (!dirName) return;
            
            if (dirName.includes('/') || dirName.includes('\\')) {
                showToast('文件夹名称不能包含 / 或 \\', 'error');
                return;
            }
            
            let fullPath = currentPath === '/' ? '/' + dirName : currentPath + '/' + dirName;
            fullPath = fullPath.replace(/\/+/g, '/');

            fetch('/mkdir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'path=' + encodeURIComponent(fullPath)
            })
            .then(response => {
                if (response.ok) {
                    showToast('文件夹创建成功', 'success');
                    loadList(currentPath);
                } else {
                    showToast('创建失败', 'error');
                }
            })
            .catch(err => showToast('请求失败: ' + err.message, 'error'));
        }

        function uploadFile(file) {
            const fileToUpload = file || selectedFile || document.getElementById('file').files[0];
            if (!fileToUpload) {
                showToast('请选择文件', 'warning');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileToUpload);
            
            // 显示进度条
            const uploadProgress = document.getElementById('uploadProgress');
            const uploadProgressBar = document.getElementById('uploadProgressBar');
            const uploadProgressText = document.getElementById('uploadProgressText');
            if (uploadProgress) uploadProgress.style.display = 'block';
            if (uploadProgressBar) uploadProgressBar.style.width = '0%';
            if (uploadProgressText) uploadProgressText.textContent = '0%';

            // 使用 XMLHttpRequest 支持上传进度
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload?path=' + encodeURIComponent(currentPath), true);

            // 上传进度监听
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    if (uploadProgressBar) uploadProgressBar.style.width = percentComplete + '%';
                    if (uploadProgressText) uploadProgressText.textContent = percentComplete + '%';
                }
            };

            // 上传完成
            xhr.onload = function() {
                if (xhr.status === 200) {
                    showToast('上传成功', 'success');
                    resetUploadArea();
                    loadList(currentPath);
                    loadStorageInfo();
                } else {
                    showToast('上传失败', 'error');
                    // 只清空文件输入，保持文件信息显示
                    document.getElementById('file').value = '';
                    selectedFile = null;
                    // 隐藏进度条
                    if (uploadProgress) uploadProgress.style.display = 'none';
                }
            };

            // 上传错误
            xhr.onerror = function() {
                showToast('上传出错: 网络错误', 'error');
                // 只清空文件输入，保持文件信息显示
                document.getElementById('file').value = '';
                selectedFile = null;
                // 隐藏进度条
                if (uploadProgress) uploadProgress.style.display = 'none';
            };

            xhr.send(formData);
        }

        function downloadFile(name) {
            let fullPath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
            fullPath = fullPath.replace(/\/+/g, '/');
            
            // 使用window.open打开下载链接
            const downloadUrl = '/download?path=' + encodeURIComponent(fullPath);
            window.open(downloadUrl, '_blank');
            showToast('开始下载: ' + name, 'info');
        }

        async function deleteItem(name, isDir) {
            let fullPath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
            fullPath = fullPath.replace(/\/+/g, '/');
            const confirmed = await showConfirm(`确定删除 ${fullPath} 吗？`, {
                type: 'danger',
                title: '确认删除'
            });
            if (!confirmed) return;

            fetch('/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'path=' + encodeURIComponent(fullPath)
            })
            .then(response => {
                if (response.ok) {
                    showToast('删除成功', 'success');
                    loadList(currentPath);
                    loadStorageInfo();
                } else if (response.status === 409) {
                    showToast('目录不为空，无法删除', 'error');
                } else {
                    showToast('删除失败', 'error');
                }
            })
            .catch(err => showToast('请求失败: ' + err.message, 'error'));
        }
    </script>
</body>
</html>
