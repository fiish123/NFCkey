<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - NFC门禁</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <link rel="stylesheet" href="/web/css/pages.css">
</head>
<body id="page-files">
    <div class="container" data-animate>
        <h1>文件管理</h1>

        <!-- 存储信息 -->
        <div class="section">
            <h3>存储空间</h3>
            <div class="storage-info">
                <div class="storage-stats">
                    <span>已使用: <strong id="usedStorage">-</strong> KB</span>
                    <span>总计: <strong id="totalStorage">-</strong> KB</span>
                </div>
                <div class="storage-stats">
                    <span>剩余: <strong id="freeStorage">-</strong> KB</span>
                    <span>(<span id="freeStoragePercent">-</span>%)</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="storageProgressBar"></div>
                </div>
            </div>
        </div>

        <!-- 文件上传 -->
        <div class="section" id="uploadSection">
            <h3>上传文件</h3>
            <div class="upload-area" id="uploadArea">
                <input type="file" id="file" style="display: none;" />
                <div id="uploadContent" class="upload-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; margin-bottom: var(--spacing-md);">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>点击选择文件或拖拽文件到此处</p>
                </div>
                <div id="fileInfo" style="display: none;">
                    <p><strong>文件名:</strong> <span id="fileName"></span></p>
                    <p><strong>大小:</strong> <span id="fileSize"></span></p>
                </div>
            </div>
            
            <!-- 上传进度 -->
            <div id="uploadProgress" class="upload-progress">
                <div id="uploadProgressBar" class="upload-progress-bar"></div>
                <span id="uploadProgressText" class="upload-progress-text">0%</span>
            </div>
        </div>

        <!-- 文件浏览器 - 合并路径导航和文件列表 -->
        <div class="section">
            <h3>文件浏览器</h3>
            <div class="path-bar">
                <button onclick="goToParent()" class="btn-sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    上级目录
                </button>
                <input type="text" id="currentPath" value="/" readonly class="path-input" />
                <button onclick="createDir()" class="btn-sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    新建文件夹
                </button>
            </div>
            <div id="fileListContainer" class="file-list"></div>
        </div>

        <!-- 返回首页 -->
        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回首页
            </a>
        </div>
    </div>

    <script src="/web/js/common.js"></script>
    <script src="/web/js/pages/files.js"></script>
</body>
</html>
