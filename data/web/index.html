<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC门禁 - ESP32-C3</title>
    <link rel="stylesheet" href="/web/css/style.css">
    <style>
        /* 页面特定样式 */
        .container {
            max-width: 640px;
            padding: var(--spacing-2xl) var(--spacing-xl);
            border-radius: var(--radius-xl);
        }

        h1 {
            font-size: 36px;
            text-shadow: 0 2px 12px rgba(8, 145, 178, 0.2);
            letter-spacing: -0.03em;
        }

        /* 按钮网格布局 */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
            max-width: 560px;
            margin: var(--spacing-xl) auto;
        }

        .btn-grid .btn {
            width: 100%;
            min-height: 56px;
            font-size: 16px;
        }

        @media (max-width: 640px) {
            .btn-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-xl) var(--spacing-lg);
                border-radius: var(--radius-lg);
            }

            h1 {
                font-size: 28px;
            }

            .btn {
                padding: 14px 24px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: var(--spacing-lg) var(--spacing-md);
            }

            h1 {
                font-size: 24px;
            }

            .system-info {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container narrow" data-animate>
        <h1>NFC门禁</h1>
        
        <div class="system-info">
            <div class="info-row">
                <span><strong>WiFi：</strong></span>
                <span id="wifi">-</span>
            </div>
            <div class="info-row">
                <span><strong>电池：</strong></span>
                <span id="battery">-</span>
            </div>
        </div>

        <div class="btn-group btn-grid">
            <a href="/files" class="btn btn-success" aria-label="文件管理">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                文件管理
            </a>
            <a href="/servo" class="btn btn-warning" aria-label="舵机管理">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                舵机管理
            </a>
            <a href="/ota" class="btn btn-info" aria-label="OTA升级">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                    <rect x="9" y="9" width="6" height="6"></rect>
                    <line x1="9" y1="1" x2="9" y2="4"></line>
                    <line x1="15" y1="1" x2="15" y2="4"></line>
                    <line x1="9" y1="20" x2="9" y2="23"></line>
                    <line x1="15" y1="20" x2="15" y2="23"></line>
                    <line x1="20" y1="9" x2="23" y2="9"></line>
                    <line x1="20" y1="14" x2="23" y2="14"></line>
                    <line x1="1" y1="9" x2="4" y2="9"></line>
                    <line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
                OTA升级
            </a>
            <button onclick="restartSystem()" class="btn btn-danger" aria-label="重启系统">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                重启系统
            </button>
        </div>
    </div>

    <script src="/web/js/common.js"></script>
    <script>
        // 页面加载时获取系统信息
        window.onload = function() {
            // 获取WiFi信息
            fetch('/api/wifi/info')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('wifi').innerHTML = data.ssid + ' (' + data.ip + ')';
                })
                .catch(error => {
                    console.error('获取WiFi信息失败:', error);
                    document.getElementById('wifi').innerHTML = '获取失败';
                });

            // 获取电池电压
            fetch('/api/battery/voltage')
                .then(response => response.json())
                .then(data => {
                    const batteryEl = document.getElementById('battery');
                    const voltage = data.voltage;
                    const status = data.status;

                    // 设置电压显示文本
                    batteryEl.textContent = voltage + ' V';

                    // 根据状态设置颜色
                    if (status === 'normal') {
                        batteryEl.style.color = '#10b981'; // 绿色
                    } else if (status === 'low') {
                        batteryEl.style.color = '#f59e0b'; // 黄色
                    } else if (status === 'critical') {
                        batteryEl.style.color = '#ef4444'; // 红色
                    }
                })
                .catch(error => {
                    console.error('获取电池电压失败:', error);
                    document.getElementById('battery').innerHTML = '获取失败';
                });
        };
        
        function restartSystem() {
            showConfirm('确定要重启系统吗？\n\n重启后将回到正常门禁模式，Web服务器将停止运行。', {
                type: 'danger',
                title: '确认重启'
            }).then(result => {
                if (result) {
                    fetch('/restart', { method: 'POST' })
                        .then(response => {
                            if (response.ok) {
                                showToast('系统正在重启，请稍候...', 'info', { duration: 5000 });
                            } else {
                                showToast('重启失败，请重试', 'error');
                            }
                        })
                        .catch(error => {
                            showToast('请求失败：' + error, 'error');
                        });
                }
            });
        }
    </script>
</body>
</html>
